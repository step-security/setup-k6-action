name: Test on Windows runner
on:
  push:

permissions:
  contents: read

jobs:
  protocol:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: Setup Grafana k6
      uses: ./
      with:
        k6-version: '0.49.0'
    - name: Check if correct k6 version is installed
      run: k6 --version | findstr "0.49.0"
    - run: k6 run ./dev/protocol.js --quiet

  use-latest-release:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: Setup Grafana k6
      uses: ./
    - run: k6 run ./dev/protocol.js --quiet

  browser:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: Setup Grafana k6
      uses: ./
      with:
        k6-version: '0.49.0'
        browser: true
    - run: k6 run ./dev/browser.js --quiet